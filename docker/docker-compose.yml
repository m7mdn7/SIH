version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: siip-db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: siip
      POSTGRES_PASSWORD: siip_dev
      POSTGRES_DB: siip
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
